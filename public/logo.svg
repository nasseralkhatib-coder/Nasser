<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Regular Hexagon with Dark Gray Border (#4D4D4D) -->
  <polygon 
    points="45,14 95,14 120,60 95,106 45,106 20,60" 
    fill="#ffffff" 
    stroke="#4D4D4D" 
    stroke-width="8" 
    stroke-linejoin="round" 
    stroke-linecap="round"
  />

  <!-- Green Molecule Connecting 3 Nodes in '<' Shape (#70C041) -->
  <path 
    d="M 80 34 L 46 60 L 80 86" 
    fill="none" 
    stroke="#70C041" 
    stroke-width="11" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  <!-- Node 1: Top Right -->
  <circle cx="80" cy="34" r="11" fill="#70C041" />
  <!-- Node 2: Apex Center-Left -->
  <circle cx="46" cy="60" r="11" fill="#70C041" />
  <!-- Node 3: Bottom Right -->
  <circle cx="80" cy="86" r="11" fill="#70C041" />
</svg>
